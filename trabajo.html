  <script>

    /* ==========================================
       HORA Y FECHA
    ========================================== */

    function updateClock(){

      const now = new Date();

      const time =
        now.toLocaleTimeString(
          "es-ES",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      const date =
        now.toLocaleDateString(
          "es-ES",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        );

      document.getElementById(
        "currentTime"
      ).textContent = time;


      document.getElementById(
        "currentDate"
      ).textContent =
        date.charAt(0).toUpperCase()
        +
        date.slice(1);


      document.getElementById(
        "calendarDay"
      ).textContent =
        now.getDate();


      updateGreeting(now);

    }


    function updateGreeting(now){

      const hour =
        now.getHours();

      let greeting =
        "Buenos días";

      let emoji =
        "☀️";


      if(hour >= 14 && hour < 21){

        greeting =
          "Buenas tardes";

        emoji =
          "🌤️";

      }


      if(hour >= 21 || hour < 6){

        greeting =
          "Buenas noches";

        emoji =
          "🌙";

      }


      document.querySelector(
        ".trabajo-greeting"
      ).innerHTML =
        `${emoji} ${greeting}, <strong>Sandra</strong>`;

    }


    updateClock();

    setInterval(
      updateClock,
      30000
    );



    /* ==========================================
       ABRIR APPS
    ========================================== */

    function openApp(url){

      window.location.href =
        url;

    }


    function openURL(url){

      window.location.href =
        url;

    }


    function openShortcut(name){

      const encoded =
        encodeURIComponent(name);

      window.location.href =
        `shortcuts://run-shortcut?name=${encoded}`;

    }



    /* ==========================================
       SECCIONES PLEGABLES
    ========================================== */

    function toggleSection(id, button){

      const section =
        document.getElementById(id);

      if(!section){
        return;
      }

      const collapsed =
        section.classList.toggle(
          "collapsed"
        );

      if(button){

        button.textContent =
          collapsed
            ? "˅"
            : "˄";

      }

    }



    /* ==========================================
       POMODORO
    ========================================== */

    let pomoSeconds =
      25 * 60;

    let pomoRunning =
      false;

    let pomoInterval =
      null;

    let pomoSessions =
      0;


    function renderPomodoro(){

      const minutes =
        Math.floor(
          pomoSeconds / 60
        );

      const seconds =
        pomoSeconds % 60;

      document.getElementById(
        "pomoTime"
      ).textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;


      document.getElementById(
        "pomoSessions"
      ).textContent =
        pomoSessions;


      document.getElementById(
        "pomoPlay"
      ).textContent =
        pomoRunning
          ? "Ⅱ"
          : "▶";

    }


    function togglePomodoro(){

      if(pomoRunning){

        clearInterval(
          pomoInterval
        );

        pomoRunning =
          false;

        renderPomodoro();

        return;

      }


      pomoRunning =
        true;

      renderPomodoro();


      pomoInterval =
        setInterval(
          () => {

            pomoSeconds--;


            if(pomoSeconds <= 0){

              clearInterval(
                pomoInterval
              );

              pomoRunning =
                false;

              pomoSessions++;

              pomoSeconds =
                25 * 60;

            }


            renderPomodoro();

          },
          1000
        );

    }


    function resetPomodoro(){

      clearInterval(
        pomoInterval
      );

      pomoRunning =
        false;

      pomoSeconds =
        25 * 60;

      renderPomodoro();

    }


    renderPomodoro();

  </script>
