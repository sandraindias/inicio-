<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f5f8">

  <link rel="stylesheet" href="./css/styles.css">

  <title>Trabajo</title>
</head>

<body class="routine-page work-page">

  <!-- CABECERA -->
  <header class="routine-header">

    <a href="./index.html" class="back-button">
      ‹
    </a>

    <div class="routine-header-text">

      <div class="eyebrow">
        TU DÍA DE HOY
      </div>

      <h1>
        💼 Trabajo
      </h1>

      <p>
        08:00 — 15:00 · Foco y acción.
      </p>

    </div>

  </header>


  <!-- CONTADOR -->
  <section class="work-hero">

    <div class="work-hero-top">

      <div>
        <div class="work-small-title">
          JORNADA DE TRABAJO
        </div>

        <div id="workStatus" class="work-status">
          08:00 – 15:00
        </div>
      </div>

      <div class="work-mode-pill">
        Trabajo
      </div>

    </div>

    <div
      id="workCountdown"
      class="work-countdown"
    >
      07:00:00
    </div>

    <div
      id="workTimerText"
      class="work-countdown-text"
    >
    </div>

  </section>


  <!-- DAILY -->
  <section
    id="dailyReminder"
    class="daily-reminder"
  >

    <div class="daily-info">

      <div class="daily-icon">
        <img
          src="https://api.iconify.design/logos/microsoft-teams.svg"
          alt="Teams"
        >
      </div>

      <div>
        <strong>
          Daily en breve
        </strong>

        <span>
          09:00 · Reunión
        </span>
      </div>

    </div>

    <button
      class="daily-open"
      onclick="launchDirect('msteams://')"
    >
      Abrir
    </button>

  </section>


  <!-- APPS -->
  <section class="routine-section">

    <div class="routine-section-header">

      <div>
        <div class="eyebrow">
          ACCESOS RÁPIDOS
        </div>

        <h2>
          Para trabajar
        </h2>
      </div>

    </div>


    <div class="work-app-grid">

      <!-- WHATSAPP -->
      <button
        class="work-app"
        onclick="launchDirect('whatsapp://')"
      >

        <div class="work-app-icon whatsapp-icon">
          <img
            src="https://api.iconify.design/logos/whatsapp-icon.svg"
            alt=""
          >
        </div>

        <span>
          WhatsApp
        </span>

      </button>


      <!-- TEAMS -->
      <button
        class="work-app"
        onclick="launchDirect('msteams://')"
      >

        <div class="work-app-icon">
          <img
            src="https://api.iconify.design/logos/microsoft-teams.svg"
            alt=""
          >
        </div>

        <span>
          Teams
        </span>

      </button>


      <!-- OUTLOOK -->
      <button
        class="work-app"
        onclick="launchDirect('ms-outlook://')"
      >

        <div class="work-app-icon">
          <img
            src="https://api.iconify.design/logos/microsoft-outlook.svg"
            alt=""
          >
        </div>

        <span>
          Outlook
        </span>

      </button>


      <!-- CALENDARIO -->
      <button
        class="work-app"
        onclick="launchDirect('calshow://')"
      >

        <div class="work-app-icon calendar-icon">
          <span>
            📅
          </span>
        </div>

        <span>
          Calendario
        </span>

      </button>


      <!-- CHATGPT -->
      <button
        class="work-app"
        onclick="launchDirect('chatgpt://')"
      >

        <div class="work-app-icon chatgpt-icon">

          <img
            src="https://api.iconify.design/simple-icons/openai.svg"
            alt=""
          >

        </div>

        <span>
          ChatGPT
        </span>

      </button>


      <!-- NOTAS -->
      <button
        class="work-app"
        onclick="launchDirect('mobilenotes://')"
      >

        <div class="work-app-icon notes-icon">
          📝
        </div>

        <span>
          Notas
        </span>

      </button>


      <!-- DRIVE -->
      <button
        class="work-app"
        onclick="launchDirect('googledrive://')"
      >

        <div class="work-app-icon">

          <img
            src="https://api.iconify.design/logos/google-drive.svg"
            alt=""
          >

        </div>

        <span>
          Drive
        </span>

      </button>


      <!-- SHORTCUTS -->
      <button
        class="work-app"
        onclick="launchDirect('shortcuts://')"
      >

        <div class="work-app-icon shortcuts-icon">
          ◈
        </div>

        <span>
          Atajos
        </span>

      </button>

    </div>

  </section>


  <!-- TIEMPO JORNADA -->
  <section class="work-card">

    <div class="work-card-heading">

      <div class="work-card-icon">
        ⏱️
      </div>

      <div>
        <div class="work-card-title">
          Tiempo Jornada
        </div>

        <div class="work-card-subtitle">
          Control de tu jornada laboral
        </div>
      </div>

    </div>

    <button
      class="work-main-button"
      onclick="launchShortcut('Abrir Tiempo Jornada')"
    >
      Abrir Tiempo Jornada
    </button>

  </section>


  <!-- POMODORO -->
  <section class="work-card pomodoro-card">

    <div class="pomo-label">
      POMODORO
    </div>

    <div class="pomo-layout">

      <div>

        <div
          id="pomoTime"
          class="pomo-time"
        >
          25:00
        </div>

        <div
          id="pomoState"
          class="pomo-state"
        >
          ● Concentración
        </div>

      </div>


      <div class="pomo-controls">

        <button
          id="playButton"
          class="pomo-play-button"
          onclick="togglePomodoro()"
        >
          ▶
        </button>

        <div class="pomo-session-area">

          <div class="sessions">
            🍅
            <span id="sessions">
              0
            </span>
          </div>

          <button
            class="pomo-reset"
            onclick="resetPomodoro()"
          >
            ↻
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- MENÚ INFERIOR -->
  <nav class="bottom-nav">

    <a
      href="./index.html"
      class="nav-item"
    >
      🏠
      <span>
        Inicio
      </span>
    </a>

    <a
      href="./amor-al-arte.html"
      class="nav-item active"
    >
      🎨
      <span>
        Amor al arte
      </span>
    </a>

    <a
      href="./descubrimiento.html"
      class="nav-item"
    >
      🪩
      <span>
        Descubrimiento
      </span>
    </a>

  </nav>


  <script src="./js/routine.js"></script>

  <script>

    /* CONTADOR DE TRABAJO */
    setupCountdown(
      8,
      0,
      15,
      0,
      "workCountdown",
      "workStatus",
      "workTimerText"
    );


    /* POMODORO */
    setupPomodoro();


    /* DAILY: 08:50 A 09:30 */
    function updateDailyReminder(){

      const now =
        new Date();

      const minutes =
        now.getHours() * 60
        +
        now.getMinutes();

      const daily =
        document.getElementById(
          "dailyReminder"
        );

      if(!daily){
        return;
      }

      const start =
        8 * 60 + 50;

      const end =
        9 * 60 + 30;

      daily.classList.toggle(
        "show",
        minutes >= start
        &&
        minutes <= end
      );

    }

    updateDailyReminder();

    setInterval(
      updateDailyReminder,
      30000
    );

  </script>

</body>

</html>
