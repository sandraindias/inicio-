  <script>

    /* ==================================================
       HORA / FECHA
    ================================================== */

    function updateClock() {

      const now =
        new Date();

      document.getElementById(
        "currentTime"
      ).textContent =
        now.toLocaleTimeString(
          "es-ES",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      const date =
        now.toLocaleDateString(
          "es-ES",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        );


      document.getElementById(
        "currentDate"
      ).textContent =
        date.charAt(0).toUpperCase()
        +
        date.slice(1);


      updateGreeting(now);

      updateGymTimer(now);

    }



    function updateGreeting(now) {

      const hour =
        now.getHours();

      let text =
        "Buenos días";

      let emoji =
        "☀️";


      if (
        hour >= 14
        &&
        hour < 21
      ) {

        text =
          "Buenas tardes";

        emoji =
          "🌤️";

      }


      if (
        hour >= 21
        ||
        hour < 6
      ) {

        text =
          "Buenas noches";

        emoji =
          "🌙";

      }


      document.querySelector(
        ".trabajo-greeting"
      ).innerHTML =
        `${emoji} ${text}, <strong>Sandra</strong>`;

    }



    /* ==================================================
       TEMPORIZADOR GYM

       Franja:
       15:00 - 17:00
    ================================================== */

    function updateGymTimer(now) {

      const start =
        new Date(now);

      start.setHours(
        15,
        0,
        0,
        0
      );


      const end =
        new Date(now);

      end.setHours(
        17,
        0,
        0,
        0
      );


      const timer =
        document.getElementById(
          "gymTime"
        );

      const status =
        document.getElementById(
          "gymStatus"
        );

      const state =
        document.getElementById(
          "gymState"
        );


      let milliseconds;


      /* ANTES DEL GYM */

      if (now < start) {

        milliseconds =
          end - start;

        status.innerHTML =
          "<span></span>Todavía no ha empezado";

        state.textContent =
          "Pendiente";

      }


      /* DURANTE EL GYM */

      else if (
        now >= start
        &&
        now < end
      ) {

        milliseconds =
          end - now;

        status.innerHTML =
          "<span></span>Tiempo restante";

        state.textContent =
          "En marcha";

      }


      /* DESPUÉS */

      else {

        timer.textContent =
          "00:00:00";

        status.innerHTML =
          "<span></span>Terminado por hoy";

        state.textContent =
          "Finalizado";

        return;

      }


      const totalSeconds =
        Math.max(
          0,
          Math.floor(
            milliseconds / 1000
          )
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );

      const seconds =
        totalSeconds % 60;


      timer.textContent =
        `${String(hours).padStart(2, "0")}:`
        +
        `${String(minutes).padStart(2, "0")}:`
        +
        `${String(seconds).padStart(2, "0")}`;

    }



    /* ==================================================
       ABRIR APP
    ================================================== */

    function openApp(url) {

      window.location.href =
        url;

    }



    function openURL(url) {

      window.location.href =
        url;

    }



    /* ==================================================
       ATAJOS IPHONE
    ================================================== */

    function openShortcut(name) {

      const encoded =
        encodeURIComponent(name);

      window.location.href =
        `shortcuts://run-shortcut?name=${encoded}`;

    }



    updateClock();

    setInterval(
      updateClock,
      1000
    );

  </script>
