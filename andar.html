<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Inicio">

<title>Andar · Mi Inicio</title>

<style>

:root{
  --bg:#f7f5f8;
  --card:rgba(255,255,255,.9);
  --text:#151622;
  --secondary:#73737d;
  --pink:#ff356f;
  --blue:#168bd9;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 2% 0%,
      rgba(255,218,230,.78),
      transparent 27%
    ),
    radial-gradient(
      circle at 98% 2%,
      rgba(226,218,255,.76),
      transparent 31%
    ),
    var(--bg);

  padding:
    calc(env(safe-area-inset-top) + 21px)
    16px
    calc(env(safe-area-inset-bottom) + 180px);
}

/* =========================
   ARRIBA
========================= */

.top-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-bottom:10px;
}

.top-action{
  border:0;
  min-height:42px;
  padding:0 14px;
  border-radius:15px;
  background:rgba(255,255,255,.84);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  color:inherit;
  font-size:12px;
  font-weight:700;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

/* =========================
   HERO
========================= */

.hero{
  display:grid;
  grid-template-columns:minmax(0,1fr) 155px;
  gap:13px;
  align-items:start;
  margin-bottom:17px;
}

.greeting{
  font-size:18px;
}

.greeting-name{
  color:var(--pink);
  font-weight:750;
}

.big-time{
  margin-top:7px;
  font-size:57px;
  line-height:.95;
  font-weight:520;
  letter-spacing:-4px;
}

.date{
  margin-top:11px;
  color:#33343d;
  font-size:14px;
  text-transform:capitalize;
}

.mode-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:12px;
  padding:7px 12px;
  border-radius:999px;
  background:#e6f3ff;
  color:#168bd9;
  font-size:11px;
  font-weight:850;
  text-transform:uppercase;
}

.mode-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#168bd9;
}

/* =========================
   ENTRETENIMIENTO
========================= */

.entertainment-card{
  padding:13px 9px;
  border-radius:22px;
  background:rgba(255,255,255,.88);
  box-shadow:0 7px 24px rgba(0,0,0,.055);
}

.entertainment-title{
  margin-bottom:11px;
  font-size:13px;
  font-weight:800;
}

.entertainment-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

/* =========================
   TARJETAS
========================= */

.card{
  margin-bottom:15px;
  padding:16px;
  border-radius:24px;
  background:var(--card);
  box-shadow:0 8px 27px rgba(0,0,0,.05);
}

/* =========================
   APPS
========================= */

.app-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:19px 8px;
}

.app{
  min-width:0;
  text-align:center;
  cursor:pointer;
}

.icon{
  position:relative;
  width:56px;
  height:56px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:15px;
  background:white;
  box-shadow:0 4px 13px rgba(0,0,0,.10);
}

.icon img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.app-name{
  margin-top:6px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:10px;
}

/* =========================
   ICONOS
========================= */

.music-icon{
  background:linear-gradient(145deg,#ff3157,#ff5c6e);
  color:white;
  font-size:31px;
}

.spotify-icon{
  background:#111;
}

.spotify-icon img{
  width:83%;
  height:83%;
}

.youtube-icon img{
  width:83%;
  height:83%;
}

.strava-icon img{
  width:100%;
  height:100%;
}

.fitness-icon{
  background:#111;
  color:white;
  font-size:30px;
}

/* =========================
   CONTADOR
========================= */

.slot-timer{
  margin-bottom:17px;
  padding:18px;
  border-radius:24px;
  background:white;
  box-shadow:0 8px 27px rgba(0,0,0,.05);
}

.slot-timer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.slot-title{
  font-size:14px;
  font-weight:850;
}

.slot-status{
  padding:6px 9px;
  border-radius:999px;
  background:#f0eef4;
  font-size:9px;
}

.slot-countdown{
  margin-top:12px;
  font-size:46px;
  letter-spacing:-2px;
}

.slot-end{
  margin-top:8px;
  color:var(--secondary);
  font-size:12px;
}

/* =========================
   TEXTOS
========================= */

.page-title{
  font-size:30px;
  font-weight:900;
}

.page-subtitle{
  margin:5px 0 20px;
  color:var(--secondary);
  font-size:14px;
}

/* =========================
   BLOQUEO
========================= */

.lock-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  background:#f5f3f7;
  text-align:center;
}

.lock-screen.show{
  display:flex;
}

.lock-title{
  font-size:30px;
  font-weight:900;
}

.unlock-button{
  margin-top:20px;
  padding:15px 40px;
  border:0;
  border-radius:16px;
  background:#111;
  color:white;
}

/* =========================
   NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:14px;
  right:14px;
  bottom:calc(env(safe-area-inset-bottom) + 18px);

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;

  padding:6px;

  border-radius:25px;

  background:rgba(248,248,250,.94);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);

  box-shadow:0 7px 31px rgba(0,0,0,.12);
}

.bottom-nav button{
  border:0;
  min-height:52px;
  border-radius:19px;
  font-weight:750;
  background:transparent;
}

.current-nav.active{
  background:#111 !important;
  color:white !important;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:390px){

  body{
    padding-left:13px;
    padding-right:13px;
    padding-bottom:
      calc(env(safe-area-inset-bottom) + 175px);
  }

  .hero{
    grid-template-columns:minmax(0,1fr) 142px;
    gap:9px;
  }

  .big-time{
    font-size:50px;
  }

  .icon{
    width:51px;
    height:51px;
  }

}

</style>
</head>

<body>


<!-- BLOQUEO -->

<div id="lockScreen" class="lock-screen">

  <div>

    <div style="font-size:50px;">
      🔒
    </div>

    <div class="lock-title">
      Mi Inicio
    </div>

    <button
      class="unlock-button"
      onclick="unlockApp()"
    >
      Volver a entrar
    </button>

  </div>

</div>


<!-- ARRIBA -->

<div class="top-actions">

  <button
    class="top-action"
    onclick="lockApp()"
  >
    🔒 Bloquear
  </button>

  <a
    class="top-action"
    href="./index.html"
    style="
      display:flex;
      align-items:center;
      text-decoration:none;
      color:inherit;
    "
  >
    ← Salir
  </a>

</div>


<!-- HERO -->

<div class="hero">

  <div>

    <div
      id="greeting"
      class="greeting"
    >
      🌙 Buenas noches,
      <span class="greeting-name">
        Sandra
      </span>
    </div>

    <div
      id="bigTime"
      class="big-time"
    >
      21:30
    </div>

    <div
      id="date"
      class="date"
    ></div>

    <div class="mode-pill">

      <span class="mode-dot"></span>

      <span>
        Andar
      </span>

    </div>

  </div>


  <!-- ENTRETENIMIENTO -->

  <div class="entertainment-card">

    <div class="entertainment-title">
      ★ Entretenimiento
    </div>

    <div class="entertainment-grid">

      <div
        class="app"
        onclick="launchDirect('music://')"
      >

        <div class="icon music-icon">
          ♪
        </div>

        <div class="app-name">
          Música
        </div>

      </div>


      <div
        class="app"
        onclick="launchDirect('spotify://')"
      >

        <div class="icon spotify-icon">

          <img
            src="https://api.iconify.design/logos/spotify-icon.svg"
            alt="Spotify"
          >

        </div>

        <div class="app-name">
          Spotify
        </div>

      </div>


      <div
        class="app"
        onclick="launchDirect('youtube://')"
      >

        <div class="icon youtube-icon">

          <img
            src="https://api.iconify.design/logos/youtube-icon.svg"
            alt="YouTube"
          >

        </div>

        <div class="app-name">
          YouTube
        </div>

      </div>

    </div>

  </div>

</div>


<!-- CONTADOR -->

<div class="slot-timer">

  <div class="slot-timer-header">

    <div class="slot-title">
      Paseo
    </div>

    <div
      id="walkTimerStatus"
      class="slot-status"
    >
      21:30 – 22:40
    </div>

  </div>

  <div
    id="walkCountdown"
    class="slot-countdown"
  >
    01:10:00
  </div>

  <div
    id="walkTimerText"
    class="slot-end"
  ></div>

</div>


<!-- CONTENIDO -->

<div class="card">

  <div class="page-title">
    Andar
  </div>

  <div class="page-subtitle">
    Muévete, despeja la cabeza y termina el día con calma.
  </div>


  <div class="app-grid">


    <!-- STRAVA -->

    <div
      class="app"
      onclick="launchDirect('strava://')"
    >

      <div class="icon strava-icon">

        <img
          src="https://api.iconify.design/logos/strava-icon.svg"
          alt="Strava"
        >

      </div>

      <div class="app-name">
        Strava
      </div>

    </div>


    <!-- MÚSICA -->

    <div
      class="app"
      onclick="launchDirect('music://')"
    >

      <div class="icon music-icon">
        ♪
      </div>

      <div class="app-name">
        Música
      </div>

    </div>


    <!-- SPOTIFY -->

    <div
      class="app"
      onclick="launchDirect('spotify://')"
    >

      <div class="icon spotify-icon">

        <img
          src="https://api.iconify.design/logos/spotify-icon.svg"
          alt="Spotify"
        >

      </div>

      <div class="app-name">
        Spotify
      </div>

    </div>


    <!-- FITNESS -->

    <div
      class="app"
      onclick="launchShortcut('Abrir Fitness')"
    >

      <div class="icon fitness-icon">
        ◎
      </div>

      <div class="app-name">
        Fitness
      </div>

    </div>

  </div>

</div>


<!-- NAVEGACIÓN -->

<nav class="bottom-nav">

  <button
    onclick="
      window.location.href='./index.html'
    "
  >
    🏠 Inicio
  </button>

  <button
    class="current-nav active"
  >
    👟 Andar
  </button>

</nav>


<script>

/* =========================
   ABRIR APPS
========================= */

function navigateExternal(url){

  const link =
    document.createElement("a");

  link.href =
    url;

  link.style.display =
    "none";

  document.body.appendChild(
    link
  );

  link.click();

  setTimeout(
    ()=>link.remove(),
    500
  );

}


function launchDirect(url){

  navigateExternal(
    url
  );

}


function launchShortcut(name){

  navigateExternal(
    "shortcuts://run-shortcut?name="
    +
    encodeURIComponent(name)
  );

}


/* =========================
   RELOJ
========================= */

function updateClock(){

  const now =
    new Date();


  document.getElementById(
    "bigTime"
  ).textContent =

    now.toLocaleTimeString(
      "es-ES",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  document.getElementById(
    "date"
  ).textContent =

    now.toLocaleDateString(
      "es-ES",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    );


  updateGreeting(
    now
  );


  updateWalkTimer(
    now
  );

}


/* =========================
   SALUDO
========================= */

function updateGreeting(now){

  const hour =
    now.getHours();


  let greeting =
    "Buenos días";


  let icon =
    "☀️";


  if(
    hour >= 14
    &&
    hour < 21
  ){

    greeting =
      "Buenas tardes";

    icon =
      "🌤️";

  }


  if(
    hour >= 21
    ||
    hour < 6
  ){

    greeting =
      "Buenas noches";

    icon =
      "🌙";

  }


  document.getElementById(
    "greeting"
  ).innerHTML =

    icon
    +
    " "
    +
    greeting
    +
    ', <span class="greeting-name">Sandra</span>';

}


/* =========================
   CONTADOR
========================= */

function formatDuration(seconds){

  const h =
    Math.floor(
      seconds / 3600
    );


  const m =
    Math.floor(
      (seconds % 3600) / 60
    );


  const s =
    seconds % 60;


  return(

    String(h)
      .padStart(
        2,
        "0"
      )

    +

    ":"

    +

    String(m)
      .padStart(
        2,
        "0"
      )

    +

    ":"

    +

    String(s)
      .padStart(
        2,
        "0"
      )

  );

}


function updateWalkTimer(now){

  const current =

    now.getHours()
    *
    60

    +

    now.getMinutes();


  const start =
    1290;


  const end =
    1360;


  const countdown =
    document.getElementById(
      "walkCountdown"
    );


  const status =
    document.getElementById(
      "walkTimerStatus"
    );


  const text =
    document.getElementById(
      "walkTimerText"
    );


  if(current < start){

    countdown.textContent =
      "01:10:00";


    status.textContent =
      "Pendiente";


    text.textContent =
      "Todavía no ha empezado";


    return;

  }


  if(
    current >= start
    &&
    current < end
  ){

    const endDate =
      new Date();


    endDate.setHours(
      22,
      40,
      0,
      0
    );


    const seconds =

      Math.max(
        0,
        Math.floor(
          (endDate - now) / 1000
        )
      );


    countdown.textContent =
      formatDuration(
        seconds
      );


    status.textContent =
      "Ahora";


    text.textContent =
      "Tiempo restante";


    return;

  }


  countdown.textContent =
    "00:00:00";


  status.textContent =
    "Finalizado";


  text.textContent =
    "Terminado por hoy";

}


/* =========================
   BLOQUEO
========================= */

function lockApp(){

  document.getElementById(
    "lockScreen"
  ).classList.add(
    "show"
  );

}


function unlockApp(){

  document.getElementById(
    "lockScreen"
  ).classList.remove(
    "show"
  );

}


/* =========================
   INICIO
========================= */

updateClock();


setInterval(
  updateClock,
  1000
);

</script>

</body>
</html>
