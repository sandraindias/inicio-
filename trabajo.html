<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>Trabajo</title>

  <link
    rel="stylesheet"
    href="./css/styles.css"
  >
</head>


<body>


  <!-- CABECERA -->

  <header class="routine-header">

    <a
      href="./index.html"
      class="back-button"
    >
      ‹
    </a>

    <div>

      <div class="eyebrow">
        TU DÍA DE HOY
      </div>

      <h1>
        💼 Trabajo
      </h1>

      <p>
        08:00 — 15:00 · Foco y acción.
      </p>

    </div>

  </header>



  <!-- CONTADOR DE JORNADA -->

  <section class="slot-timer">

    <div class="slot-timer-header">

      <div class="slot-title">
        Jornada de trabajo
      </div>

      <div
        id="workStatus"
        class="slot-status"
      >
        08:00 – 15:00
      </div>

    </div>


    <div
      id="workCountdown"
      class="slot-countdown"
    >
      07:00:00
    </div>


    <div
      id="workTimerText"
      class="slot-end"
    ></div>

  </section>



  <!-- DAILY -->

  <section
    id="dailyReminder"
    class="daily"
  >

    <div class="daily-left">

      <img
        class="daily-logo"
        src="https://api.iconify.design/logos/microsoft-teams.svg"
      >

      <div>

        <div class="daily-title">
          Daily en breve
        </div>

        <div class="daily-subtitle">
          09:00 · Reunión
        </div>

      </div>

    </div>


    <button
      class="daily-button"
      onclick="launchDirect('msteams://')"
    >
      Teams
    </button>

  </section>



  <!-- APPS DE TRABAJO -->

  <section class="card">

    <div
      class="heading-left"
      style="margin-bottom:18px"
    >
      Tus apps
    </div>


    <div class="app-grid">


      <!-- WHATSAPP -->

      <div
        class="app"
        onclick="launchDirect('whatsapp://')"
      >

        <div class="icon whatsapp-icon">

          <img
            src="https://api.iconify.design/logos/whatsapp-icon.svg"
          >

        </div>

        <div class="app-name">
          WhatsApp
        </div>

      </div>



      <!-- TEAMS -->

      <div
        class="app"
        onclick="launchDirect('msteams://')"
      >

        <div class="icon teams-icon">

          <img
            src="https://api.iconify.design/logos/microsoft-teams.svg"
          >

        </div>

        <div class="app-name">
          Teams
        </div>

      </div>



      <!-- OUTLOOK -->

      <div
        class="app"
        onclick="launchDirect('ms-outlook://')"
      >

        <div class="icon outlook-icon">

          <img
            src="https://api.iconify.design/logos/microsoft-outlook.svg"
          >

        </div>

        <div class="app-name">
          Outlook
        </div>

      </div>



      <!-- CALENDARIO -->

      <div
        class="app"
        onclick="launchDirect('calshow://')"
      >

        <div
          class="icon"
          style="
            font-size:28px;
            background:white;
          "
        >
          📅
        </div>

        <div class="app-name">
          Calendario
        </div>

      </div>



      <!-- CHATGPT -->

      <div
        class="app"
        onclick="openExternalWeb('https://chatgpt.com')"
      >

        <div class="icon chatgpt-icon">

          <img
            src="https://api.iconify.design/simple-icons/openai.svg"
          >

        </div>

        <div class="app-name">
          ChatGPT
        </div>

      </div>



      <!-- NOTAS -->

      <div
        class="app"
        onclick="launchDirect('mobilenotes://')"
      >

        <div class="icon">

          <div
            style="
              width:100%;
              height:100%;
              background:white;
            "
          >

            <div class="notes-yellow"></div>

            <div class="note-line"></div>
            <div class="note-line"></div>
            <div class="note-line"></div>

          </div>

        </div>

        <div class="app-name">
          Notas
        </div>

      </div>


    </div>

  </section>



  <!-- TIEMPO JORNADA -->

  <section class="card">

    <div class="heading-left">
      ⏱️ Tiempo Jornada
    </div>

    <button
      class="primary-action"
      style="
        width:100%;
        margin-top:12px
      "
      onclick="launchShortcut('Abrir Tiempo Jornada')"
    >
      Abrir Tiempo Jornada
    </button>

  </section>



  <!-- POMODORO -->

  <section class="card">

    <div class="pomo-label">
      POMODORO
    </div>


    <div class="pomo-layout">


      <div>

        <div
          id="pomoTime"
          class="pomo-time"
        >
          25:00
        </div>

        <div
          id="pomoState"
          class="pomo-state"
        >
          ● Concentración
        </div>

      </div>



      <div class="pomo-right">

        <button
          id="playButton"
          class="play-button"
          onclick="togglePomodoro()"
        >
          ▶
        </button>


        <div>

          <div class="sessions">
            🍅
            <span id="sessions">
              0
            </span>
          </div>

          <button
            class="reset-button"
            onclick="resetPomodoro()"
          >
            ↻
          </button>

        </div>

      </div>


    </div>

  </section>



  <!-- NAVEGACIÓN -->

  <nav class="bottom-nav">

    <a
      href="./index.html"
      class="nav-item"
    >
      🏠
      <span>Inicio</span>
    </a>

    <a
      href="./amor-al-arte.html"
      class="nav-item"
    >
      🎨
      <span>Amor al arte</span>
    </a>

    <a
      href="./descubrimiento.html"
      class="nav-item"
    >
      🪩
      <span>Descubrimiento</span>
    </a>

  </nav>



  <script src="./js/routine.js"></script>


  <script>

    /* CONTADOR 08:00 - 15:00 */

    setupCountdown(
      8,
      0,
      15,
      0,
      "workCountdown",
      "workStatus",
      "workTimerText"
    );



    /* POMODORO */

    setupPomodoro();



    /* DAILY */

    function updateDaily(){

      const now =
        new Date();

      const minutes =
        now.getHours() * 60
        +
        now.getMinutes();


      const daily =
        document.getElementById(
          "dailyReminder"
        );


      /*
        Aparece desde
        08:50 hasta 09:30
      */

      daily.classList.toggle(
        "show",
        minutes >= 530
        &&
        minutes <= 570
      );

    }


    updateDaily();


    setInterval(
      updateDaily,
      30000
    );

  </script>


</body>

</html>
