<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Andar · Amor al arte</title>
<link rel="stylesheet" href="styles.css">
</head>

<body class="routine-page">

<header class="routine-header">
<a href="index.html" class="back-button">‹</a>
<div>
<div class="eyebrow">AMOR AL ARTE</div>
<h1>👟 Andar</h1>
<p>21:30 — 22:40 · Muévete y desconecta.</p>
</div>
</header>

<section class="slot-timer">
<div class="slot-timer-header">
<div class="slot-title">Paseo</div>
<div id="walkStatus" class="slot-status">21:30 – 22:40</div>
</div>
<div id="walkCountdown" class="slot-countdown">01:10:00</div>
<div id="walkTimerText" class="slot-end"></div>
</section>

<section class="card">

<div class="app-grid">

<div class="app" onclick="launchDirect('strava://')">
<div class="icon strava-icon">
<img src="https://api.iconify.design/logos/strava-icon.svg">
</div>
<div class="app-name">Strava</div>
</div>

<div class="app" onclick="launchDirect('music://')">
<div class="icon music-icon">♪</div>
<div class="app-name">Música</div>
</div>

<div class="app" onclick="launchDirect('spotify://')">
<div class="icon spotify-icon">
<img src="https://api.iconify.design/logos/spotify-icon.svg">
</div>
<div class="app-name">Spotify</div>
</div>

<div class="app" onclick="launchShortcut('Abrir Fitness')">
<div class="icon fitness-icon">◎</div>
<div class="app-name">Fitness</div>
</div>

</div>
</section>

<nav class="bottom-nav three-nav">
<a href="index.html">🏠 Inicio</a>
<a href="amor-al-arte.html" class="active">🎨 Amor al arte</a>
<a href="descubrimiento.html">🪩 Descubrimiento</a>
</nav>

<script src="common.js"></script>
<script>
setupCountdown(21,30,22,40,"walkCountdown","walkStatus","walkTimerText");
</script>

</body>
</html>
