  </button>

</nav>

<script>

function navigateExternal(url){
  const link=document.createElement("a");
  link.href=url;
  link.style.display="none";
  document.body.appendChild(link);
  link.click();

  setTimeout(
    ()=>link.remove(),
    500
  );
}

function launchDirect(url){
  navigateExternal(url);
}

function launchShortcut(name){
  navigateExternal(
    "shortcuts://run-shortcut?name="
    +
    encodeURIComponent(name)
  );
}

function updateClock(){

  const now=new Date();

  document.getElementById(
    "bigTime"
  ).textContent=
    now.toLocaleTimeString(
      "es-ES",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  document.getElementById(
    "date"
  ).textContent=
    now.toLocaleDateString(
      "es-ES",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    );

  updateGreeting(now);
  updateGymTimer(now);
}

function updateGreeting(now){

  const hour=now.getHours();

  let greeting="Buenos días";
  let icon="☀️";

  if(hour>=14 && hour<21){
    greeting="Buenas tardes";
    icon="🌤️";
  }

  if(hour>=21 || hour<6){
    greeting="Buenas noches";
    icon="🌙";
  }

  document.getElementById(
    "greeting"
  ).innerHTML=
    icon+
    " "+
    greeting+
    ', <span class="greeting-name">Sandra</span>';
}

function formatDuration(seconds){

  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;

  return(
    String(h).padStart(2,"0")
    +":"
    +String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0")
  );
}

function updateGymTimer(now){

  const current=
    now.getHours()*60+
    now.getMinutes();

  const start=900;
  const end=1020;

  const countdown=
    document.getElementById("gymCountdown");

  const status=
    document.getElementById("gymTimerStatus");

  const text=
    document.getElementById("gymTimerText");

  if(current<start){

    countdown.textContent="02:00:00";
    status.textContent="Pendiente";
    text.textContent="Todavía no ha empezado";
    return;
  }

  if(current>=start && current<end){

    const endDate=new Date();

    endDate.setHours(
      17,
      0,
      0,
      0
    );

    const seconds=
      Math.max(
        0,
        Math.floor(
          (endDate-now)/1000
        )
      );

    countdown.textContent=
      formatDuration(seconds);

    status.textContent="Ahora";
    text.textContent="Tiempo restante";
    return;
  }

  countdown.textContent="00:00:00";
  status.textContent="Finalizado";
  text.textContent="Terminado por hoy";
}

function lockApp(){
  document.getElementById(
    "lockScreen"
  ).classList.add("show");
}

function unlockApp(){
  document.getElementById(
    "lockScreen"
  ).classList.remove("show");
}

updateClock();

setInterval(
  updateClock,
  1000
);

</script>
